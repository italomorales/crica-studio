@if (showConstruction) {
<crica-construction />
} @else {
@if (!isAdmin) {
<crica-header />
}
<router-outlet />
@if (!isAdmin) {
<crica-footer />
<a
    class="floating-whatsapp"
    data-whatsapp-source="floating"
    [href]="floatingWhatsappUrl"
    target="_blank"
    rel="noopener noreferrer"
    [attr.aria-label]="'Fale com a Crica pelo WhatsApp (nova aba)' | translate">
    <img src="/assets/construction/whatsapp.svg" alt="" width="28" height="28" />
    <span> {{ 'Fale com a Crica' | translate }} </span>
</a>
}

}
