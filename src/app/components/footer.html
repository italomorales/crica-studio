<footer>
    <div class="container footer-inner">
        <a [routerLink]="homePath" [attr.aria-label]="'Crica Studio — início' | translate">
            <img src="/assets/crica-studio-logo-transparent.png" alt="Crica Studio" width="140" height="51" />
        </a>
        <p> {{ 'Ideias que ganham forma.' | translate }} </p>
        <div class="footer-socials" [attr.aria-label]="'Redes sociais da Crica Studio' | translate">
            <span class="footer-socials-title"> {{ 'Acompanhe a Crica' | translate }} </span>
            <div class="footer-socials-links">
                <a href="https://www.instagram.com/crica.studio/" target="_blank" rel="noopener noreferrer" [attr.aria-label]="'Instagram da Crica Studio: @crica.studio' | translate">
                    <img src="/assets/construction/instagram.svg" alt="" width="20" height="20" />
                    <span>Instagram</span>
                </a>
                <a href="https://www.tiktok.com/@crica.studio" target="_blank" rel="noopener noreferrer" [attr.aria-label]="'TikTok da Crica Studio: @crica.studio' | translate">
                    <img src="/assets/construction/tiktok.svg" alt="" width="20" height="20" />
                    <span>TikTok</span>
                </a>
                <a class="whatsapp" data-whatsapp-source="footer" href="https://wa.me/5511963136152" target="_blank" rel="noopener noreferrer" [attr.aria-label]="'Fale com a Crica pelo WhatsApp: +55 11 96313-6152' | translate">
                    <img src="/assets/construction/whatsapp.svg" alt="" width="20" height="20" />
                    <span>WhatsApp</span>
                </a>
            </div>
        </div>
        <label class="language-menu">
            <img
                [src]="languageFlag()"
                alt=""
                width="22"
                height="15"
                aria-hidden="true" />
            <span class="sr-only">{{ 'Idioma' | translate }}</span>
            <select
                [value]="language()"
                (change)="setLanguage($any($event.target).value)"
                [attr.aria-label]="'Idioma' | translate">
                @for (item of languages; track item.code) {
                <option [value]="item.code" [selected]="language() === item.code">
                    {{ item.nativeName }}
                </option>
                }
            </select>
        </label>
        <a class="admin-entry" routerLink="/login"> {{ 'Administração' | translate }} </a>
    </div>
</footer>
