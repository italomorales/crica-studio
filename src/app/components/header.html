<a class="skip" href="#main">{{ 'Pular para o conteúdo' | translate }}</a>
<header class="site-header">
    <div class="container header-inner">
        <a
            [routerLink]="homePath"
            [attr.aria-label]="'Crica Studio — início' | translate"
            class="brand">
            <img
                src="/assets/crica-studio-logo-transparent.png"
                alt="Crica Studio"
                width="140"
                height="51" />
        </a>
        <nav [attr.aria-label]="'Navegação principal' | translate">
            @if (showShop) {
            <a routerLink="/loja" routerLinkActive="active" ariaCurrentWhenActive="page">
                {{ 'Loja' | translate }}
            </a>
            }
            <a routerLink="/fornecedores" routerLinkActive="active" ariaCurrentWhenActive="page">
                {{ 'Fornecedores' | translate }}
            </a>
            <a routerLink="/vitrine" routerLinkActive="active" ariaCurrentWhenActive="page">
                {{ 'Vitrines' | translate }}
            </a>
        </nav>
        <label class="language-menu">
            <img
                [src]="'/assets/languages/' + language() + '.svg'"
                alt=""
                width="22"
                height="15"
                aria-hidden="true" />
            <span class="sr-only">{{ 'Idioma' | translate }}</span>
            <select
                [value]="language()"
                (change)="setLanguage($any($event.target).value)"
                [attr.aria-label]="'Idioma' | translate">
                @for (item of languages; track item.code) {
                <option [value]="item.code" [selected]="language() === item.code">
                    {{ item.name }}
                </option>
                }
            </select>
        </label>
    </div>
</header>
