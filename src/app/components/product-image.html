<div class="product-visual">
    @if (src && !failed) {
    <img
        [src]="src"
        [alt]="alt | translate"
        (error)="failed = true"
        loading="lazy"
        width="640"
        height="640" />
    } @else {
    <div class="image-placeholder">
        <span>{{ label | translate }}</span>
        <small>{{ 'Imagem em preparação' | translate }}</small>
    </div>
    }
</div>
