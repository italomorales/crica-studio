<article class="product-card affiliate-card">
    <div class="affiliate-card-media">
        <crica-product-image [src]="product.image" [alt]="product.name" [label]="product.category" />
        <button
            class="share-product"
            type="button"
            (click)="share()"
            [attr.aria-label]="'Compartilhar ' + product.name">
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                <circle cx="18" cy="5" r="2.5" />
                <circle cx="6" cy="12" r="2.5" />
                <circle cx="18" cy="19" r="2.5" />
                <path d="m8.2 10.8 7.6-4.4M8.2 13.2l7.6 4.4" />
            </svg>
            <span class="sr-only">Compartilhar</span>
        </button>
    </div>
    <div class="card-body">
        <div class="affiliate-tags">
        <span
            class="platform"
            [class.shopee]="product.platform === 'Shopee'"
            [class.mercado]="product.platform === 'Mercado Livre'">
            {{ product.platform }}
        </span>
        @if (product.international) {
        <span class="platform international">Internacional</span>
        }
        </div>
        <h3>{{ product.name }}</h3>
        <p>{{ product.description }}</p>
        @if (url) {
        <a class="text-action" [href]="url" target="_blank" rel="sponsored noopener noreferrer">
            Ver {{ preposition }} {{ product.platform }}
            <span aria-hidden="true">↗</span>
            <span class="sr-only">(link de afiliado, abre em nova aba)</span>
        </a>
        } @else {
        <button class="text-action" (click)="demo.emit(product)">
            Ver {{ preposition }} {{ product.platform }}
            <span aria-hidden="true">↗</span>
        </button>
        }
    </div>
</article>
