<main class="login-page">
    <div class="login-brand-panel">
        <a routerLink="/loja">
            <img src="/assets/crica-studio-logo-transparent.png" alt="Crica Studio" width="180" height="66" />
        </a>
        <div>
            <span class="eyebrow">POR DENTRO DA CRICA</span>
            <h1>
                Um espaço para
                <br />
                suas próximas ideias.
            </h1>
            <p>
                Organize os produtos da loja, suas indicações e os detalhes que fazem a Crica ser
                sua.
            </p>
        </div>
        <a routerLink="/loja" class="back-store">← Voltar à loja</a>
    </div>
    <section class="login-form-panel">
        <div class="login-card">
            <h2>Bem-vinda à administração.</h2>
            <p>Entre para cuidar do seu catálogo.</p>
            <form (ngSubmit)="submit()">
                <label for="email">E-mail</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="username"
                    required
                    [(ngModel)]="email" />
                <label for="password">Senha</label>
                <div class="password-field">
                    <input
                        id="password"
                        name="password"
                        [type]="show ? 'text' : 'password'"
                        autocomplete="current-password"
                        required
                        [(ngModel)]="password" />
                    <button
                        type="button"
                        (click)="show = !show"
                        [attr.aria-label]="show ? 'Ocultar senha' : 'Mostrar senha'">
                        {{ show ? 'Ocultar' : 'Mostrar' }}
                    </button>
                </div>
                @if (error) {
                <p class="error-text" role="alert">{{ error }}</p>
                }
                <button class="primary full" type="submit" [disabled]="loading">
                    {{ loading ? 'Entrando…' : 'Entrar' }}
                    <span aria-hidden="true">→</span>
                </button>
            </form>
        </div>
    </section>
</main>
