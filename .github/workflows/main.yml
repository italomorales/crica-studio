name: Build and Deploy Angular

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tests and media protection
        run: npm test

      - name: Build Angular
        run: npm run build

      - name: Package matching HTML shell for blog API
        run: node scripts/package-blog-shell.mjs

      - name: Preserve blog shell for backend release
        uses: actions/upload-artifact@v4
        with:
          name: blog-html-shell-${{ github.sha }}
          path: .blog-html-shell/
          include-hidden-files: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to S3
        run: |
          # Uploaded catalog media shares this bucket and is not part of dist/.
          # Excluded keys are also protected from --delete.
          # Retain previous hashed assets while API HTML caches and existing browser tabs use them.
          aws s3 sync dist/assets/ s3://${{ vars.S3_BUCKET }}/assets/
          # Publish entry points only after their matching assets are available.
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET }}/ --delete --exclude 'catalog/*' --exclude 'assets/*'
          aws s3 cp dist/blog-shell.json s3://${{ vars.S3_BUCKET }}/blog-shell.json --content-type application/json --cache-control 'no-store'

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths '/*'
